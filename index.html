<!DOCTYPE html>

    <style>
        body { 
            font-family: sans-serif; 
            background-color: #fdfae6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
            overflow: hidden; 
        }

        #app { 
            background: white; 
            padding: 40px; 
            border-radius: 30px; 
            text-align: center; 
            width: 100%; 
            max-width: 850px; 
            max-height: 95vh; 
            overflow-y: auto; 
            border: 4px solid #50bda1; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            box-sizing: border-box; 
            position: relative; 
        }

        #p0 { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #000; 
            z-index: 1000; 
            cursor: pointer; 
            outline: none; 
        }

        .slide-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
        }

        .slide-wrapper { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: none; 
            background-color: #000;
            overflow: hidden;
        }

        .slide-wrapper.active { 
            display: block; 
            animation: fadeIn 0.8s ease-in-out; 
        }

        .slide-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes fadeIn { 
            from { opacity: 0.3; } 
            to { opacity: 1; } 
        }

        .slideshow-ui { 
            position: absolute; 
            bottom: 60px; 
            left: 50%; 
            transform: translateX(-50%); 
            text-align: center; 
            width: 90%; 
            max-width: 600px; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 20px 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            pointer-events: none; 
            z-index: 5; 
        }

        .slideshow-title { 
            color: #50bda1; 
            margin: 0 0 10px 0; 
            font-size: 2.2rem; 
        }

        .prompt-text { 
            margin: 0; 
            font-size: 1.4rem; 
            color: #ff7e67; 
            font-weight: bold; 
            animation: pulseText 1.8s infinite; 
        }

        @keyframes pulseText { 
            0% { opacity: 0.6; } 
            50% { opacity: 1; } 
            100% { opacity: 0.6; } 
        }

        h1 { font-size: 2.5rem; }
        p { font-size: 1.2rem; line-height: 1.6; }

        .btn { 
            background: #ff7e67; 
            color: white; 
            border: none; 
            padding: 24px; 
            border-radius: 50px; 
            font-size: 1.5rem; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            margin-top: 25px; 
            transition: 0.2s; 
        }

        .btn:active { 
            background: #e66b55; 
            transform: scale(0.98); 
        }

        .slider-box { 
            margin: 35px 0; 
            padding: 35px 30px; 
            background: #f9f9f9; 
            border-radius: 24px; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03); 
        }

        .slider-box input[type="range"] { 
            -webkit-appearance: none; 
            appearance: none; 
            width: 100%; 
            height: 24px; 
            background: #e0f2f1; 
            border-radius: 12px; 
            outline: none; 
            margin: 25px 0; 
            cursor: pointer; 
        }

        .slider-box input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            appearance: none; 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            background: #ff7e67; 
            cursor: pointer; 
        }

        .hidden { 
            display: none; 
        }

        canvas { 
            background: white; 
            border: 1px solid #ddd; 
            margin-top: 20px; 
            width: 100%; 
            height: 280px; 
            border-radius: 15px; 
            display: block; 
        }

        .corner-link { 
            position: absolute; 
            top: 25px; 
            right: 30px; 
            color: #777; 
            cursor: pointer; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: bold; 
            background: #f0f0f0; 
            padding: 8px 14px; 
            border-radius: 20px; 
            border: 1px solid #ddd; 
            transition: 0.2s; 
            z-index: 1010; 
        }

        @media (min-width: 768px) { 
            #app { padding: 60px; } 
        }
    </style>
</head>

<body onmousemove="resetIdleTimer()" onclick="resetIdleTimer()" ontouchstart="resetIdleTimer()">

<div id="app">

    <span id="p1-header-link" class="corner-link hidden" onclick="showCal()">🔒 Pro Calibration</span>

    <!-- PAGE 0 -->
    <div id="p0" onclick="startApp()">

        <div id="slideContainer" class="slide-container">

            <!-- FALLBACK SLIDES -->
            <div class="slide-wrapper active">
                <img src="https://picsum.photos/1400/900?1">
            </div>

            <div class="slide-wrapper">
                <img src="https://picsum.photos/1400/900?2">
            </div>

            <div class="slide-wrapper">
                <img src="https://picsum.photos/1400/900?3">
            </div>

        </div>

        <div class="slideshow-ui">
            <h1 class="slideshow-title">🌈 dB Scout Experience</h1>
            <p class="prompt-text">👉 TAP ANYWHERE TO START ASSESSMENT</p>
        </div>

    </div>

    <!-- PAGE 1 -->
    <div id="p1" class="hidden">

        <h1 style="color:#50bda1; margin-bottom: 5px; margin-top: 15px;">
            🌈 dB Scout
        </h1>

        <p style="margin-top: 0; color: #666;">
            Windows Chrome Tablet Edition
        </p>

        <button id="startBtn" class="btn" onclick="init()">
            UNLOCK AUDIO & BEGIN
        </button>

    </div>

    <!-- PAGE 2 -->
    <div id="p2" class="hidden">

        <div id="tag" style="font-weight:bold; font-size: 1.6rem;">
            LEFT EAR
        </div>

        <h2 id="freq" style="color:#ff7e67; font-size: 4rem; margin: 20px 0;">
            500 Hz
        </h2>

        <div class="slider-box">

            <input
                type="range"
                id="slide"
                min="-15"
                max="70"
                step="5"
                value="-15"
                oninput="changeVol(this.value)"
            >

            <p id="label" style="font-size: 2.2rem; margin: 15px 0; font-weight: bold; color: #333;">
                Level: -15 dB
            </p>

        </div>

        <button class="btn" style="background:#50bda1" onclick="step()">
            SAVE & NEXT
        </button>

    </div>

</div>

<script>

//////////////////////////////////////////////////////
// SUPABASE CONFIG
//////////////////////////////////////////////////////

const SUPABASE_URL =
"https://otffjqbukzlsbptelyjh.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90ZmZqcWJ1a3psc2JwdGVseWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODA1MzMsImV4cCI6MjA5NDY1NjUzM30.NzHVg4UI50Q-cIb5jdsiv209fmK7ExvEeO-zvo8BzZE";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

//////////////////////////////////////////////////////
// ORIGINAL VARIABLES
//////////////////////////////////////////////////////

let freqs = [500,1000,2000,4000];

let res = {
    Left: [],
    Right: []
};

let ear = "Left";
let idx = 0;

let ctx = null;
let osc = null;
let gain = null;
let pan = null;

let offsets = {
    500:0,
    1000:0,
    2000:0,
    4000:0
};

let slideIndex = 0;
let slideInterval = null;
let idleTimer = null;
let appActive = false;

//////////////////////////////////////////////////////
// LOAD REMOTE SLIDES
//////////////////////////////////////////////////////

async function loadRemoteSlides() {

    try {

        const { data, error } = await supabaseClient
            .from('kiosk_slideshows')
            .select('image_urls')
            .eq('kiosk_id', 'kiosk_01')
            .single();

        if(error) {

            console.error(error);

            return;
        }

        if(
            !data ||
            !data.image_urls ||
            data.image_urls.length === 0
        ) {

            console.log("No slides found");

            return;
        }

        const container =
            document.getElementById("slideContainer");

        container.innerHTML = "";

        data.image_urls.forEach((url,index)=>{

            const slide =
                document.createElement("div");

            slide.className =
                index === 0
                ? "slide-wrapper active"
                : "slide-wrapper";

            slide.innerHTML = `
                <img src="${url}">
            `;

            container.appendChild(slide);

        });

        console.log("Slides loaded");

    } catch(err) {

        console.error(err);

    }

}

//////////////////////////////////////////////////////
// SLIDESHOW
//////////////////////////////////////////////////////

function startSlideshowTimer() {

    clearInterval(slideInterval);

    slideInterval = setInterval(rotateSlidesDOM, 10000);

}

function rotateSlidesDOM() {

    let wrappers =
        document.querySelectorAll(".slide-wrapper");

    if(wrappers.length === 0) return;

    wrappers[slideIndex].classList.remove("active");

    slideIndex =
        (slideIndex + 1) % wrappers.length;

    wrappers[slideIndex].classList.add("active");

}

//////////////////////////////////////////////////////
// START APP
//////////////////////////////////////////////////////

function startApp() {

    appActive = true;

    clearInterval(slideInterval);

    document.getElementById("p0")
        .classList.add("hidden");

    document.getElementById("p1")
        .classList.remove("hidden");

    document.getElementById("p1-header-link")
        .classList.remove("hidden");

    resetIdleTimer();

}

//////////////////////////////////////////////////////
// IDLE TIMER
//////////////////////////////////////////////////////

function resetIdleTimer() {

    if (!appActive) return;

    clearTimeout(idleTimer);

    idleTimer =
        setTimeout(exitToSlideshow, 120000);

}

function exitToSlideshow() {

    appActive = false;

    clearTimeout(idleTimer);

    document.getElementById("p1")
        .classList.add("hidden");

    document.getElementById("p2")
        .classList.add("hidden");

    document.getElementById("p0")
        .classList.remove("hidden");

    startSlideshowTimer();

}

//////////////////////////////////////////////////////
// HEARING FUNCTIONS
//////////////////////////////////////////////////////

async function init() {

    if (!ctx)
        ctx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    await ctx.resume();

    document.getElementById("p1")
        .classList.add("hidden");

    document.getElementById("p2")
        .classList.remove("hidden");

    setup();

}

function setup() {

    if (osc) {

        try { osc.stop(); } catch(e){}

        osc.disconnect();

    }

    osc = ctx.createOscillator();

    gain = ctx.createGain();

    if (ctx.createStereoPanner) {

        pan = ctx.createStereoPanner();

        pan.pan.value =
            (ear === "Left" ? -1 : 1);

        osc.connect(gain)
            .connect(pan)
            .connect(ctx.destination);

    } else {

        osc.connect(gain)
            .connect(ctx.destination);

    }

    osc.frequency.value = freqs[idx];

    gain.gain.value = 0;

    osc.start();

    document.getElementById("tag")
        .innerText =
            ear.toUpperCase() + " EAR";

    document.getElementById("freq")
        .innerText =
            freqs[idx] + " Hz";

}

function changeVol(v) {

    document.getElementById("label")
        .innerText =
            "Level: " + v + " dB";

    let f = freqs[idx];

    let calibratedValue =
        parseFloat(v) + (offsets[f] || 0);

    let g =
        Math.pow(
            10,
            (calibratedValue - 70) / 20
        );

    if (gain)
        gain.gain.setTargetAtTime(
            g,
            ctx.currentTime,
            0.05
        );

}

function step() {

    res[ear].push(
        parseInt(
            document.getElementById("slide").value
        )
    );

    document.getElementById("slide").value = -15;

    idx++;

    if (idx >= freqs.length) {

        if (ear === "Left") {

            ear = "Right";

            idx = 0;

            setup();

        } else {

            alert("Test Finished");

        }

    } else {

        setup();

    }

}

function showCal() {

    alert("Calibration");

}

//////////////////////////////////////////////////////
// INIT
//////////////////////////////////////////////////////

window.onload = async function() {

    await loadRemoteSlides();

    startSlideshowTimer();

};

</script>

</body>
</html>
