<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>dB Scout</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:sans-serif;
    background:#000;
}

#p0{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:black;
    cursor:pointer;
}

.slide-container{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.slide-wrapper{
    position:absolute;
    width:100%;
    height:100%;
    display:none;
}

.slide-wrapper.active{
    display:block;
}

.slide-wrapper img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.slideshow-ui{
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.85);
    padding:20px 35px;
    border-radius:20px;
    text-align:center;
    z-index:5;
}

.slideshow-title{
    margin:0;
    color:#50bda1;
}

.prompt-text{
    margin-top:10px;
    color:#ff7e67;
    font-weight:bold;
    font-size:1.2rem;
}

#p1{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:#fdfae6;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:30px;
    box-sizing:border-box;
}

.btn{
    background:#ff7e67;
    color:white;
    border:none;
    padding:20px 30px;
    border-radius:50px;
    font-size:1.4rem;
    cursor:pointer;
    margin-top:20px;
}

</style>
</head>

<body>

<!-- PAGE 0 -->
<div id="p0" onclick="startApp()">

    <div id="slideContainer" class="slide-container">

    </div>

    <div class="slideshow-ui">
        <h1 class="slideshow-title">🌈 dB Scout Experience</h1>
        <p class="prompt-text">👉 TAP ANYWHERE TO START</p>
    </div>

</div>

<!-- PAGE 1 -->
<div id="p1">

    <h1 style="color:#50bda1;">🌈 dB Scout</h1>

    <p style="font-size:1.2rem;">
        Hearing Screener Ready
    </p>

    <button class="btn" onclick="location.reload()">
        RETURN HOME
    </button>

</div>

<script>

//////////////////////////////////////////////////////
// SUPABASE CONFIG
//////////////////////////////////////////////////////

const SUPABASE_URL = "https://otffjqbukzlsbptelyjh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90ZmZqcWJ1a3psc2JwdGVseWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODA1MzMsImV4cCI6MjA5NDY1NjUzM30.NzHVg4UI50Q-cIb5jdsiv209fmK7ExvEeO-zvo8BzZE";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

//////////////////////////////////////////////////////
// GLOBALS
//////////////////////////////////////////////////////

let slideIndex = 0;
let slideInterval = null;

//////////////////////////////////////////////////////
// LOAD SLIDES
//////////////////////////////////////////////////////

async function loadSlides(){

    try{

        console.log("Loading slides...");

        const { data, error } = await supabaseClient
            .from('kiosk_slideshows')
            .select('*')
            .eq('kiosk_id', 'kiosk_01')
            .single();

        if(error){

            console.error("Supabase Error:", error);

            loadFallbackSlides();

            return;
        }

        console.log("Supabase Data:", data);

        if(
            !data ||
            !data.image_urls ||
            data.image_urls.length === 0
        ){

            console.error("No images found");

            loadFallbackSlides();

            return;
        }

        const container = document.getElementById("slideContainer");

        container.innerHTML = "";

        data.image_urls.forEach((url, index)=>{

            const slide = document.createElement("div");

            slide.className =
                index === 0
                ? "slide-wrapper active"
                : "slide-wrapper";

            slide.innerHTML = `
                <img src="${url}">
            `;

            container.appendChild(slide);

        });

        startSlideshow();

    }
    catch(err){

        console.error("Load Error:", err);

        loadFallbackSlides();

    }

}

//////////////////////////////////////////////////////
// FALLBACK
//////////////////////////////////////////////////////

function loadFallbackSlides(){

    console.log("Using fallback slides");

    const fallback = [
        "https://picsum.photos/1400/900?1",
        "https://picsum.photos/1400/900?2",
        "https://picsum.photos/1400/900?3"
    ];

    const container = document.getElementById("slideContainer");

    container.innerHTML = "";

    fallback.forEach((url, index)=>{

        const slide = document.createElement("div");

        slide.className =
            index === 0
            ? "slide-wrapper active"
            : "slide-wrapper";

        slide.innerHTML = `
            <img src="${url}">
        `;

        container.appendChild(slide);

    });

    startSlideshow();

}

//////////////////////////////////////////////////////
// START SLIDESHOW
//////////////////////////////////////////////////////

function startSlideshow(){

    clearInterval(slideInterval);

    slideInterval = setInterval(()=>{

        const slides =
            document.querySelectorAll(".slide-wrapper");

        if(slides.length === 0) return;

        slides[slideIndex].classList.remove("active");

        slideIndex =
            (slideIndex + 1) % slides.length;

        slides[slideIndex].classList.add("active");

    }, 5000);

}

//////////////////////////////////////////////////////
// START APP
//////////////////////////////////////////////////////

function startApp(){

    document.getElementById("p0").style.display = "none";

    document.getElementById("p1").style.display = "flex";

}

//////////////////////////////////////////////////////
// INIT
//////////////////////////////////////////////////////

window.onload = async ()=>{

    await loadSlides();

};

</script>

</body>
</html>
