            left: 0;

        </button>

    </div>

</div>

<script>

//////////////////////////////////////////////////////
// SUPABASE CONFIG
//////////////////////////////////////////////////////

const SUPABASE_URL = "https://otffjqbukzlsbptelyjh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90ZmZqcWJ1a3psc2JwdGVseWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODA1MzMsImV4cCI6MjA5NDY1NjUzM30.NzHVg4UI50Q-cIb5jdsiv209fmK7ExvEeO-zvo8BzZE";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

//////////////////////////////////////////////////////
// GLOBALS
//////////////////////////////////////////////////////

let slideIndex = 0;
let slideInterval = null;
let idleTimer = null;
let appActive = false;

//////////////////////////////////////////////////////
// LOAD SLIDES FROM SUPABASE
//////////////////////////////////////////////////////

async function loadSlides() {

    try {

        console.log("Loading slideshow...");

        const { data, error } = await supabaseClient
            .from('kiosk_slideshows')
            .select('*')
            .eq('kiosk_id', 'kiosk_01')
            .single();

        if (error) {

            console.error("Supabase Error:", error);

            loadFallbackSlides();

            return;
        }

        console.log("Slide Data:", data);

        if (!data || !data.image_urls || data.image_urls.length === 0) {

            console.error("No slideshow images found");

            loadFallbackSlides();

            return;
        }

        const container = document.getElementById("slideContainer");

        container.innerHTML = "";

        data.image_urls.forEach((url, index) => {

            const slide = document.createElement("div");

            slide.className =
                index === 0
                ? "slide-wrapper active"
                : "slide-wrapper";

            slide.innerHTML = `
                <img src="${url}">
            `;

            container.appendChild(slide);

        });

        startSlideshowTimer();

    } catch (err) {

        console.error("Load Failed:", err);

        loadFallbackSlides();

    }

}

//////////////////////////////////////////////////////
// FALLBACK SLIDES
//////////////////////////////////////////////////////

function loadFallbackSlides() {

    const fallbackSlides = [

        "https://picsum.photos/1400/900?1",
        "https://picsum.photos/1400/900?2",
        "https://picsum.photos/1400/900?3"

    ];

    const container = document.getElementById("slideContainer");

    container.innerHTML = "";

    fallbackSlides.forEach((url, index) => {

        const slide = document.createElement("div");

        slide.className =
            index === 0
            ? "slide-wrapper active"
            : "slide-wrapper";

        slide.innerHTML = `
            <img src="${url}">
        `;

        container.appendChild(slide);

    });

    startSlideshowTimer();

}

//////////////////////////////////////////////////////
// ROTATE SLIDES
//////////////////////////////////////////////////////

function startSlideshowTimer() {

    clearInterval(slideInterval);

    slideInterval = setInterval(rotateSlidesDOM, 6000);

}

function rotateSlidesDOM() {

    const wrappers = document.querySelectorAll(".slide-wrapper");

    if (wrappers.length === 0) return;

    wrappers[slideIndex].classList.remove("active");

    slideIndex = (slideIndex + 1) % wrappers.length;

    wrappers[slideIndex].classList.add("active");

}

//////////////////////////////////////////////////////
// START APP
//////////////////////////////////////////////////////

function startApp() {

    appActive = true;

    clearInterval(slideInterval);

    document.getElementById("p0").classList.add("hidden");

    document.getElementById("p1").classList.remove("hidden");

    resetIdleTimer();

}

//////////////////////////////////////////////////////
// IDLE TIMER
//////////////////////////////////////////////////////

function resetIdleTimer() {

    if (!appActive) return;

    clearTimeout(idleTimer);

    idleTimer = setTimeout(exitToSlideshow, 120000);

}

function exitToSlideshow() {

    appActive = false;

    clearTimeout(idleTimer);

    document.getElementById("p1").classList.add("hidden");

    document.getElementById("p0").classList.remove("hidden");

    startSlideshowTimer();

}

//////////////////////////////////////////////////////
// INIT
//////////////////////////////////////////////////////

window.onload = async function () {

    await loadSlides();

};

</script>

</body>
