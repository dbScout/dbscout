<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>dB Scout</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fdfae6;
    overflow:hidden;
}

.hidden{
    display:none !important;
}

#p0{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
    cursor:pointer;
}

#slideContainer{
    position:absolute;
    inset:0;
}

.slide-wrapper{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1s;
}

.slide-wrapper.active{
    opacity:1;
}

.slide-wrapper img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    bottom:50px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.9);
    padding:25px 40px;
    border-radius:25px;
    text-align:center;
    z-index:10;
}

.overlay h1{
    margin:0;
    color:#50bda1;
    font-size:2.5rem;
}

.overlay p{
    margin-top:10px;
    color:#ff7e67;
    font-size:1.4rem;
    font-weight:bold;
}

#app{
    max-width:850px;
    margin:auto;
    background:white;
    min-height:100vh;
    overflow-y:auto;
    padding:40px;
    box-sizing:border-box;
}

.btn{
    width:100%;
    padding:22px;
    border:none;
    border-radius:40px;
    background:#ff7e67;
    color:white;
    font-size:1.4rem;
    font-weight:bold;
    cursor:pointer;
    margin-top:25px;
}

.btn:active{
    transform:scale(0.98);
}

.slider-box{
    margin-top:40px;
}

input[type=range]{
    width:100%;
}

canvas{
    width:100%;
    height:300px;
    border:1px solid #ddd;
    margin-top:20px;
}

</style>
</head>

<body>

<!-- PAGE 0 -->
<div id="p0">

    <div id="slideContainer"></div>

    <div class="overlay">
        <h1>🌈 dB Scout</h1>
        <p>TAP ANYWHERE TO START</p>
    </div>

</div>

<!-- MAIN APP -->
<div id="app" class="hidden">

    <!-- PAGE 1 -->
    <div id="p1">

        <h1 style="color:#50bda1;">🌈 dB Scout</h1>

        <p>Windows Chrome Tablet Edition</p>

        <button class="btn" onclick="startAssessment()">
            START ASSESSMENT
        </button>

    </div>

    <!-- PAGE 2 -->
    <div id="p2" class="hidden">

        <h2 id="earLabel">LEFT EAR</h2>

        <h1 id="freqLabel">500 Hz</h1>

        <div class="slider-box">

            <input
                type="range"
                id="volumeSlider"
                min="-15"
                max="70"
                step="5"
                value="-15"
                oninput="updateVolume(this.value)"
            >

            <h2 id="dbLabel">-15 dB</h2>

        </div>

        <button class="btn" onclick="nextStep()">
            SAVE & NEXT
        </button>

    </div>

    <!-- PAGE 3 -->
    <div id="p3" class="hidden">

        <h1 style="color:#50bda1;">
            Your Results
        </h1>

        <canvas id="chart"></canvas>

        <button class="btn" onclick="goHome()">
            RETURN HOME
        </button>

    </div>

</div>

<script>

//////////////////////////////////////////////////////
// SLIDESHOW
//////////////////////////////////////////////////////

const testImages = [

    "https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600",

    "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1600",

    "https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1600"

];

let slideIndex = 0;
let slideInterval = null;

function loadSlides(){

    const container =
        document.getElementById("slideContainer");

    container.innerHTML = "";

    testImages.forEach((url,index)=>{

        const div = document.createElement("div");

        div.className =
            index === 0
            ? "slide-wrapper active"
            : "slide-wrapper";

        div.innerHTML = `
            <img src="${url}" />
        `;

        container.appendChild(div);

    });

}

function rotateSlides(){

    const slides =
        document.querySelectorAll(".slide-wrapper");

    if(slides.length === 0) return;

    slides[slideIndex]
        .classList.remove("active");

    slideIndex =
        (slideIndex + 1) % slides.length;

    slides[slideIndex]
        .classList.add("active");

}

function startSlideshow(){

    clearInterval(slideInterval);

    slideInterval =
        setInterval(rotateSlides,10000);

}

//////////////////////////////////////////////////////
// AUDIO TEST
//////////////////////////////////////////////////////

const freqs = [500,1000,2000,4000];

let results = {
    Left:[],
    Right:[]
};

let currentEar = "Left";
let currentFreqIndex = 0;

let audioCtx = null;
let oscillator = null;
let gainNode = null;

document
.getElementById("p0")
.addEventListener("click",openWelcomePage);

function openWelcomePage(){

    document
    .getElementById("p0")
    .classList.add("hidden");

    document
    .getElementById("app")
    .classList.remove("hidden");

}

async function startAssessment(){

    if(!audioCtx){

        audioCtx =
            new(window.AudioContext ||
            window.webkitAudioContext)();

    }

    await audioCtx.resume();

    document
    .getElementById("p1")
    .classList.add("hidden");

    document
    .getElementById("p2")
    .classList.remove("hidden");

    setupTone();

}

function setupTone(){

    if(oscillator){

        try{
            oscillator.stop();
        }catch(e){}

    }

    oscillator =
        audioCtx.createOscillator();

    gainNode =
        audioCtx.createGain();

    oscillator.frequency.value =
        freqs[currentFreqIndex];

    gainNode.gain.value = 0;

    oscillator
        .connect(gainNode)
        .connect(audioCtx.destination);

    oscillator.start();

    document
    .getElementById("earLabel")
    .innerText =
        currentEar.toUpperCase() + " EAR";

    document
    .getElementById("freqLabel")
    .innerText =
        freqs[currentFreqIndex] + " Hz";

}

function updateVolume(v){

    document
    .getElementById("dbLabel")
    .innerText =
        v + " dB";

    const gain =
        Math.pow(10,(v - 70)/20);

    gainNode.gain.setTargetAtTime(
        gain,
        audioCtx.currentTime,
        0.05
    );

}

function nextStep(){

    const val =
        parseInt(
            document
            .getElementById("volumeSlider")
            .value
        );

    results[currentEar].push(val);

    document
    .getElementById("volumeSlider")
    .value = -15;

    updateVolume(-15);

    currentFreqIndex++;

    if(currentFreqIndex >= freqs.length){

        if(currentEar === "Left"){

            currentEar = "Right";
            currentFreqIndex = 0;

            setupTone();

        }else{

            finishAssessment();

        }

    }else{

        setupTone();

    }

}

function finishAssessment(){

    try{
        oscillator.stop();
    }catch(e){}

    document
    .getElementById("p2")
    .classList.add("hidden");

    document
    .getElementById("p3")
    .classList.remove("hidden");

    drawChart();

}

function drawChart(){

    const canvas =
        document.getElementById("chart");

    const ctx =
        canvas.getContext("2d");

    canvas.width =
        canvas.offsetWidth;

    canvas.height = 300;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.font = "20px Arial";

    ctx.fillText(
        "Assessment Complete",
        50,
        50
    );

    ctx.fillText(
        "Left Ear: " +
        results.Left.join(", "),
        50,
        120
    );

    ctx.fillText(
        "Right Ear: " +
        results.Right.join(", "),
        50,
        170
    );

}

function goHome(){

    location.reload();

}

//////////////////////////////////////////////////////
// START
//////////////////////////////////////////////////////

loadSlides();

startSlideshow();

</script>

</body>
</html>
